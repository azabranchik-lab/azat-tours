<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- viewport-fit=cover so env(safe-area-inset-bottom) is a real number on notched iPhones;
     without it the sticky action bar's safe-area padding silently resolves to 0 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<title>Build Your Trip, Design Your Own Kyrgyzstan Adventure | Azat Tours</title>
<meta name="description" content="Design your perfect Kyrgyzstan trip in 4 easy steps. Tell us your style, dates and how you like to travel, we'll match you with tours and send a tailored plan within 24 hours. Free, no prepayment." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script src="theme.js"></script>
</head>
<body data-page="builder">

<!-- header, mobile menu and footer are injected by nav.js, same as every other page -->

<main class="builder-wrap">
  <div class="steps-bar" id="stepsBar"></div>
  <div class="builder-grid">
    <div id="stepArea"></div>
    <aside><div class="summary-card" id="summary"></div></aside>
  </div>
</main>

<script src="nav.js"></script>
<script src="script.js"></script>
<script src="tours-data.js"></script>
<script src="sights-data.js"></script>
<script src="builder.js"></script>
<script src="chat.js"></script>
</body>
</html>
