<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- viewport-fit=cover so env(safe-area-inset-bottom) is a real number on notched iPhones;
     without it the sticky action bar's safe-area padding silently resolves to 0 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#103b39" />
<title>Build Your Trip, Design Your Own Kyrgyzstan Adventure | Azat Tours</title>
<meta name="description" content="Design your perfect Kyrgyzstan trip in 4 easy steps. Tell us your style, dates and how you like to travel, we'll match you with tours and send a tailored plan within 24 hours. Free, no prepayment." />
<meta name="robots" content="noindex" />
<link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/styles.css" />
<script>/* theme: set before paint (no flash) + toggle; inlined so it costs no render-blocking request */(function(){try{var t=localStorage.getItem("theme");if(t!=="dark"&&t!=="light")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}window.toggleTheme=function(){var cur=document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";var next=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);try{localStorage.setItem("theme",next);}catch(e){}var mm=document.getElementById("mobileMenu");if(mm)mm.classList.remove("open");};})();</script>
<script src="/analytics.js" defer></script>
</head>
<body data-page="builder">

<!-- header, mobile menu and footer are injected by nav.js, same as every other page -->

<main class="builder-wrap">
  <div class="steps-bar" id="stepsBar"></div>
  <div class="builder-grid">
    <div id="stepArea"></div>
    <aside><div class="summary-card" id="summary"></div></aside>
  </div>
</main>

<script src="/nav.js"></script>
<script src="/script.js"></script>
<script src="/builder-data.js"></script>
<script src="/sights-data.js"></script>
<script src="/builder.js"></script>
<script src="/chat.js" defer></script>
</body>
</html>
