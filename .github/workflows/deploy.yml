# Auto-deploy Azat Tours to the VPS on every push to main.
#
# Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST     — VPS IP or hostname (e.g. 1.2.3.4 or azattours.com)
#   SSH_USER     — SSH user (e.g. root or ubuntu)
#   SSH_KEY      — private SSH key (contents of ~/.ssh/id_ed25519 or similar)
#   DEPLOY_PATH  — absolute path to the project on the server (e.g. /var/www/azat-tours)
#
# Optional:
#   SSH_PORT     — non-standard SSH port (defaults to 22 if unset)
#
# One-time server setup (do this BEFORE the first CI run):
#   1. Install Node 18+, npm, git, pm2 (npm i -g pm2)
#   2. git clone https://github.com/azabranchik-lab/azat-tours.git $DEPLOY_PATH
#      (for a private repo: add a deploy key on the server or use a PAT)
#   3. cd $DEPLOY_PATH && npm ci --omit=dev
#   4. Copy config.example.json → config.json and fill in token + ownerId
#   5. Move the live images/ folder into public/images/ (post-reorg layout)
#   6. node scripts/regenerate-all.js
#   7. pm2 start ecosystem.config.js && pm2 save && pm2 startup
#   8. Verify the site is up, then add the secrets above and push to trigger CI.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger from the GitHub UI

concurrency:
  group: deploy-production
  cancel-in-progress: false  # queue runs; don't cancel a live deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH → pull → regen → pm2 reload
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "→ fetching main"
            git fetch --prune origin main
            git checkout main
            git reset --hard origin/main
            echo "→ installing prod deps"
            npm ci --omit=dev
            MIGRATE_FAILED=""
            # Without content/*.json, regenerating would overwrite the committed
            # public/*-data.js with empty data and the site would lose all tours.
            if [ -s content/tours.json ]; then
              echo "→ one-time content migrations (renames, text fixes)"
              # A failed migration must not leave the old process running against the new
              # files: the site also works on unmigrated content, so carry on with the
              # reload and fail the run at the very end so the problem is visible.
              node scripts/migrate.js || MIGRATE_FAILED=1
              echo "→ regenerating public/*-data.js from content/*.json"
              node scripts/regenerate-all.js
            else
              echo "→ content/tours.json missing: skipping migrations and regen, serving committed public/*-data.js"
            fi
            echo "→ pm2 reload"
            pm2 startOrReload ecosystem.config.js --update-env
            sleep 2
            echo "→ health check"
            PORT=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('config.json')).port||5173)}catch(e){console.log(5173)}")
            curl -sfL "http://127.0.0.1:$PORT/" > /dev/null || (echo 'site down after reload'; pm2 logs azat-tours --lines 30 --nostream; exit 1)
            echo "→ partners bot: deps + restart (its DB migrations run on start)"
            (cd partners && npm ci --omit=dev)
            pm2 startOrRestart partners/ecosystem.config.js --update-env
            sleep 5
            pm2 describe azat-partners | grep -qE "status\s+│\s+online" || (echo 'partners bot not online after restart'; pm2 logs azat-partners --lines 30 --nostream; exit 1)
            if [ -n "$MIGRATE_FAILED" ]; then echo "site is up, but a content migration failed: see the log above"; exit 1; fi
            echo "✓ deploy done"
